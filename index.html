<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Log</title>
<meta name="description" content="Study, entertainment and sleep, drawn as one 24-hour day.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Study Log">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Day Ledger — Apple-native structure (tab bar, large titles, inset grouped sections),
   one signature: the 24-hour band that draws the whole day. Colours follow iOS system colours,
   tuned for AA text contrast; study, entertainment and sleep each own one hue. */
:root{
  --bg:#F2F2F7;           /* systemGroupedBackground */
  --card:#FFFFFF;         /* secondarySystemGroupedBackground */
  --fill:#E9E9EE;         /* tertiary fill: tracks, chips */
  --fill2:#F4F4F7;
  --label:#111114;
  --label2:#5F5F66;       /* secondary text, 6.3:1 on white */
  --label3:#8E8E93;       /* tertiary, decorative only */
  --sep:rgba(60,60,67,.16);
  --sep-strong:rgba(60,60,67,.24);
  --tint:#5856D6;         /* systemIndigo — study, primary actions */
  --tint-ink:#4644C2;
  --tint-soft:rgba(88,86,214,.12);
  --fun:#FF2D55;          /* systemPink — entertainment marks */
  --fun-ink:#C4123E;
  --fun-soft:rgba(255,45,85,.12);
  --sleep:#32ADE6;        /* systemCyan — sleep marks */
  --sleep-ink:#0B6E9E;
  --sleep-soft:rgba(50,173,230,.14);
  --good:#248A3D;
  --warn:#FF9500;
  --warn-ink:#A85A00;
  --warn-soft:rgba(255,149,0,.14);
  --danger:#D70015;
  --danger-soft:rgba(255,59,48,.12);
  --scrim:rgba(0,0,0,.32);
  --glass:rgba(255,255,255,.78);
  --shadow:0 10px 30px rgba(17,17,20,.12),0 2px 6px rgba(17,17,20,.06);
  --sys:-apple-system,"SF Pro Text","SF Pro",system-ui,"Hiragino Sans","Hiragino Kaku Gothic ProN","Segoe UI","Yu Gothic UI","Noto Sans JP",sans-serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,"Hiragino Maru Gothic ProN","Hiragino Sans","Segoe UI",sans-serif;
  --r-card:16px;
  --r-ctl:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --fill2:#232326;
  --label:#FFFFFF; --label2:#A6A6AD; --label3:#6E6E73;
  --sep:rgba(84,84,88,.55); --sep-strong:rgba(120,120,128,.5);
  --tint:#7D7AFF; --tint-ink:#A5A3FF; --tint-soft:rgba(125,122,255,.2);
  --fun:#FF375F; --fun-ink:#FF6B88; --fun-soft:rgba(255,55,95,.2);
  --sleep:#40C8E0; --sleep-ink:#64D2FF; --sleep-soft:rgba(64,200,224,.2);
  --good:#30D158; --warn:#FF9F0A; --warn-ink:#FFB340; --warn-soft:rgba(255,159,10,.2);
  --danger:#FF453A; --danger-soft:rgba(255,69,58,.2);
  --scrim:rgba(0,0,0,.55); --glass:rgba(30,30,32,.72);
  --shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --fill2:#232326;
  --label:#FFFFFF; --label2:#A6A6AD; --label3:#6E6E73;
  --sep:rgba(84,84,88,.55); --sep-strong:rgba(120,120,128,.5);
  --tint:#7D7AFF; --tint-ink:#A5A3FF; --tint-soft:rgba(125,122,255,.2);
  --fun:#FF375F; --fun-ink:#FF6B88; --fun-soft:rgba(255,55,95,.2);
  --sleep:#40C8E0; --sleep-ink:#64D2FF; --sleep-soft:rgba(64,200,224,.2);
  --good:#30D158; --warn:#FF9F0A; --warn-ink:#FFB340; --warn-soft:rgba(255,159,10,.2);
  --danger:#FF453A; --danger-soft:rgba(255,69,58,.2);
  --scrim:rgba(0,0,0,.55); --glass:rgba(30,30,32,.72);
  --shadow:0 10px 30px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--label);font:400 17px/1.3 var(--sys);letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased}
::selection{background:var(--tint-soft);color:var(--label)}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px;border-radius:8px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit;caret-color:var(--tint)}
.tnum{font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:17px;height:17px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- frame ---------- */
.app{max-width:720px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px calc(112px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none}
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 4px 6px}
.nav h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em}
.nav .sub{font-size:15px;color:var(--label2);margin-top:1px}
.navbtns{display:flex;gap:8px;align-items:center;padding-bottom:6px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--card);color:var(--tint)}
.iconbtn:active{opacity:.6}
.sync{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;
  background:var(--card);font-size:13px;font-weight:600;color:var(--label2)}
.sync.bad{background:var(--warn-soft);color:var(--warn-ink)}
.sync .ic{width:16px;height:16px}

h2.sec{font-size:20px;line-height:25px;font-weight:600;margin:28px 4px 10px;letter-spacing:.005em;
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;text-wrap:balance}
h2.sec .aside{font-size:15px;font-weight:400;color:var(--label2);letter-spacing:-.01em}
.card{background:var(--card);border-radius:var(--r-card);padding:16px}
.card+.card{margin-top:10px}
.lead{font-size:17px;line-height:22px;font-weight:600;margin:0 0 4px;text-wrap:pretty}
.foot{font-size:13px;line-height:18px;color:var(--label2)}
.hint{font-size:15px;line-height:20px;color:var(--label2)}

/* ---------- buttons, chips, fields ---------- */
.btn{min-height:50px;padding:0 22px;border-radius:999px;font-size:17px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,opacity .12s}
.btn:active:not(:disabled){transform:scale(.97);opacity:.85}
.btn:disabled{opacity:.38;cursor:default}
.btn.filled{background:var(--tint);color:#fff}
.btn.tinted{background:var(--tint-soft);color:var(--tint-ink)}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.plain{color:var(--tint-ink);padding:0 12px}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.fun{background:var(--fun-soft);color:var(--fun-ink)}
.btn.sleep{background:var(--sleep-soft);color:var(--sleep-ink)}
.btn.sm{min-height:36px;padding:0 14px;font-size:15px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 0;min-width:0;padding:0 12px;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex-shrink:0;height:36px;padding:0 14px;border-radius:999px;background:var(--fill);
  display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:500;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--tint-soft);color:var(--tint-ink);box-shadow:inset 0 0 0 1.5px var(--tint)}
.chip.fun[aria-pressed="true"]{background:var(--fun-soft);color:var(--fun-ink);box-shadow:inset 0 0 0 1.5px var(--fun)}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--sep-strong);color:var(--label2)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--label2)}
.input{height:46px;padding:0 14px;border-radius:var(--r-ctl);border:0;background:var(--fill);font-size:17px;width:100%}
.input:focus{outline:2px solid var(--tint);outline-offset:0}
textarea.input{height:auto;min-height:84px;padding:12px 14px;resize:vertical;line-height:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}

/* ---------- the 24-hour band (signature) ---------- */
.band{position:relative;height:46px;border-radius:10px;background:var(--fill2);overflow:hidden;margin-top:12px;
  box-shadow:inset 0 0 0 1px var(--sep)}
.band .grid{position:absolute;top:0;bottom:0;width:1px;background:var(--sep)}
.band .span{position:absolute;top:6px;bottom:6px;border-radius:5px;min-width:3px;padding:0}
.band .span.sleep{background:var(--sleep);top:0;bottom:0;border-radius:0;opacity:.9}
.band .span.fun{background:var(--fun);top:12px;bottom:12px}
.band .span.live{animation:pulse 2s ease-in-out infinite}
.band .span[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--label)}
.band .now{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--label);border-radius:2px;pointer-events:none}
.band .now::after{content:"";position:absolute;top:0;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--label)}
.ticks{position:relative;height:18px;margin-top:4px;font-size:11px;color:var(--label2);font-weight:500}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--label2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bandsel{margin-top:10px;min-height:20px;font-size:15px;color:var(--label)}
@keyframes pulse{50%{opacity:.55}}

/* ---------- timer ---------- */
.timer{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--fill);stroke-width:12}
.ring .val{fill:none;stroke:var(--tint);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.ring .val.done{stroke:var(--good)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font:600 20px var(--rounded)}
.clockbox{min-width:0}
.clockbox .k{font-size:15px;color:var(--label2)}
.clock{font:600 44px/1.05 var(--rounded);letter-spacing:-.02em;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.clock.live{color:var(--tint)}
.clockbox .s{font-size:15px;color:var(--label2)}
.timerbtns{margin-top:16px}
.intent{margin-top:14px}
.subjrow{margin-top:14px}
@media (max-width:380px){.timer{grid-template-columns:1fr;justify-items:center;text-align:center}}

/* ---------- quote ---------- */
.quote{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;padding:18px 16px}
.quote p{margin:0;font-size:17px;line-height:24px;text-wrap:pretty}
.quote .src{font-size:13px;color:var(--label2);margin-top:8px}
.quote .iconbtn{width:36px;height:36px;background:var(--fill)}

/* ---------- entertainment + sleep ---------- */
.meter{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.statline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big{font:600 28px/1.1 var(--rounded);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.big.fun{color:var(--fun-ink)}.big.sleep{color:var(--sleep-ink)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.quick .btn{min-height:40px;padding:0 6px;font-size:15px}
.nights{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.night{display:flex;flex-direction:column;align-items:center;gap:5px}
.night .sq{width:100%;max-width:42px;aspect-ratio:1;border-radius:9px;background:var(--fill);position:relative;overflow:hidden}
.night .sq i{position:absolute;left:0;right:0;bottom:0;background:var(--sleep)}
.night .sq i.short{background:var(--warn)}
.night .sq.today{box-shadow:inset 0 0 0 2px var(--label)}
.night span{font-size:12px;color:var(--label2);font-weight:500}

/* ---------- lists ---------- */
.list{background:var(--card);border-radius:var(--r-card);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.row.ind+.row.ind::before{left:52px}
button.row:active,a.row:active{background:var(--fill2)}
.row .tx{flex:1;min-width:0}
button.row,.row button.tx{text-align:left}
.setrow .tx{flex:1 0 auto}
.setrow .val{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.approw .seg{width:210px}
@media (max-width:480px){.approw{flex-wrap:wrap}.approw .seg{width:auto;flex:1 1 100%;margin-left:40px}}
.row .t1{font-size:17px;line-height:22px}
.row .t2{font-size:15px;line-height:20px;color:var(--label2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{color:var(--label2);font-size:17px}
.row .chev{color:var(--label3)}
.row .badge{height:24px;padding:0 8px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;color:var(--label2)}
.row .sw{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex-shrink:0}
.row .del{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--label3);margin-right:-10px}
.row .del:hover{color:var(--danger)}
.empty{padding:28px 20px;text-align:center}
.empty .lead{margin-bottom:6px}

/* ---------- segmented ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{height:32px;border-radius:8px;font-size:14px;font-weight:500;color:var(--label)}
.seg button[aria-selected="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chartbar{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.chartbar .seg{flex:1}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--tint)}
.stepper button:active{background:var(--fill)}

/* ---------- charts ---------- */
.chart{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:var(--gap,8px);align-items:end}
.col{display:flex;flex-direction:column;align-items:stretch;cursor:pointer;min-width:0;border-radius:8px;padding:0 1px}
.col .up{height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.col .dn{height:44px;display:flex;flex-direction:column;justify-content:flex-start}
.col .axis{height:1px;background:var(--sep-strong)}
.stack{display:flex;flex-direction:column-reverse;border-radius:6px 6px 2px 2px;overflow:hidden;min-height:0;transition:height .35s ease}
.stack.fun{flex-direction:column;border-radius:2px 2px 6px 6px;opacity:.85}
.stack i{display:block;width:100%}
.col .lab{text-align:center;font-size:12px;color:var(--label2);margin-top:6px;line-height:15px;font-weight:500}
.col .lab b{display:block;font-size:14px;color:var(--label);font-weight:600}
.col.today .lab b{color:var(--tint-ink)}
.col[aria-pressed="true"]{background:var(--fill2)}
.col[aria-pressed="true"] .lab b{text-decoration:underline;text-underline-offset:3px}
.target{position:absolute;left:0;right:0;border-top:1.5px dashed var(--label3);pointer-events:none}
.target span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--label2);font-weight:600;background:var(--card);padding:0 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dw{text-align:center;font-size:12px;color:var(--label2);font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--fill2);display:grid;place-items:center;
  font-size:14px;font-weight:600;color:var(--label2);position:relative;overflow:hidden}
.cal .d .h{position:absolute;inset:0}
.cal .d b{position:relative;font-weight:600}
.cal .d.has b{color:#fff}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--label)}
.cal .d[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--tint),0 0 0 2px var(--card),0 0 0 4px var(--tint)}
.cal .d.void{background:transparent;pointer-events:none}
.keyrow{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--label2)}
.keyrow span{display:inline-flex;align-items:center;gap:6px}
.keyrow i{width:10px;height:10px;border-radius:3px}

/* ---------- insights ---------- */
.hours{display:grid;grid-template-columns:repeat(19,1fr);gap:3px;align-items:end;height:96px;margin-top:12px}
.hours i{display:block;border-radius:3px 3px 1px 1px;background:var(--fill)}
.hours i.g{background:var(--tint)}.hours i.b{background:var(--warn)}
.hlab{display:grid;grid-template-columns:repeat(19,1fr);gap:3px;font-size:11px;color:var(--label2);margin-top:5px;text-align:center}
.drift{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.dr{display:grid;grid-template-columns:96px 1fr 70px;gap:10px;align-items:center;font-size:15px}
.dr .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr .b{height:14px;border-radius:4px;background:var(--fill);position:relative;overflow:hidden}
.dr .b i{position:absolute;left:0;top:0;bottom:0}
.dr .b u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--label)}
.dr .v{text-align:right;color:var(--label2);font-variant-numeric:tabular-nums}
.bk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:90px;margin-top:12px}
.bk i{display:block;border-radius:5px 5px 2px 2px;background:var(--tint)}
.bklab{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;font-size:12px;color:var(--label2);margin-top:5px;text-align:center}
.unlock{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:12px}
.unlock i{display:block;height:100%;background:var(--label3)}

/* ---------- notice ---------- */
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-card);background:var(--warn-soft);color:var(--label);margin-top:10px}
.notice .ic{color:var(--warn-ink);margin-top:1px}
.notice.danger{background:var(--danger-soft)}
.notice.danger .ic{color:var(--danger)}
.notice b{display:block;font-size:15px;margin-bottom:2px}
.notice p{margin:0;font-size:15px;line-height:20px;color:var(--label)}
.notice .btn{margin-top:10px}

/* ---------- tab bar (floating glass with a hard edge) ---------- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;
  display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
  box-shadow:var(--shadow),inset 0 0 0 1px var(--sep-strong)}
.tab{width:78px;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11px;font-weight:600;color:var(--label2)}
.tab[aria-selected="true"]{color:var(--tint-ink);background:var(--tint-soft)}
.tab .ic{width:22px;height:22px}
@media (max-width:360px){.tab{width:68px}}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;transition:opacity .25s ease}
.scrim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;
  max-height:min(90vh,100%);display:flex;flex-direction:column;transform:translateY(102%);
  transition:transform .32s cubic-bezier(.2,.9,.25,1);box-shadow:var(--shadow);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--label3);opacity:.5;margin:7px auto 0}
.sheet header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 8px 6px;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.sheet header h3{margin:0;font-size:17px;font-weight:600;text-align:center}
.sheet header .l{justify-self:start}.sheet header .r{justify-self:end}
.sheet header .r.btn{font-weight:700}
.sheet .body{overflow-y:auto;padding:8px 16px 22px;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overscroll-behavior:contain}
.sheet .body .card{padding:14px}
@media (min-width:720px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:540px;border-radius:20px;
    transform:translate(-50%,-46%);opacity:0;transition:transform .28s cubic-bezier(.2,.9,.25,1),opacity .2s;max-height:86vh}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .sheet .grab{display:none}
}
.focus5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.focus5 button{height:56px;border-radius:14px;background:var(--fill);font:600 20px var(--rounded)}
.focus5 button[aria-pressed="true"]{background:var(--tint);color:#fff}
.focuslab{text-align:center;font-size:15px;color:var(--label2);min-height:20px}
.diag{font-size:13px;line-height:19px}
.diag div{padding:8px 0;border-bottom:1px solid var(--sep)}
.diag b.ok{color:var(--good)}.diag b.no{color:var(--danger)}
.diag code{display:block;color:var(--label2);word-break:break-word;font:12px ui-monospace,Menlo,monospace;margin-top:2px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 4px 40px}
.swatches button{width:30px;height:30px;border-radius:50%}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--label)}
.tagname{flex:1;min-width:0;height:40px;border:0;background:transparent;font-size:17px;padding:0}
.tagname:focus{outline:0;box-shadow:inset 0 -2px 0 var(--tint)}

/* ---------- sign-in gate ---------- */
.gate{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-block:40px}
.gate h1{margin:0;font-size:40px;line-height:46px;font-weight:700;letter-spacing:.005em}
.gatelead{margin:0;max-width:30ch;font-size:19px;line-height:26px;color:var(--label2);text-wrap:balance}
.gateband{position:relative;width:min(340px,100%);height:40px;border-radius:10px;background:var(--fill2);box-shadow:inset 0 0 0 1px var(--sep);overflow:hidden;margin-bottom:8px}
.gateband i{position:absolute;top:7px;bottom:7px;border-radius:5px}
.gateband i:first-child{top:0;bottom:0;border-radius:0}
.tabbar[hidden]{display:none}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:50;
  background:var(--label);color:var(--bg);font-size:15px;font-weight:600;padding:11px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- wide screens: Today gets two columns ---------- */
@media (min-width:980px){
  .app{max-width:1040px}
  .todaygrid{display:grid;grid-template-columns:1.1fr 1fr;gap:0 24px;align-items:start}
  .todaygrid>*{min-width:0}
  .todaygrid>.span2{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation:none!important}
}

  if(!guardWrite(k,v))return Promise.resolve(false);qVal[k]=v;queued[k]=true;clearTimeout(qTimer[k]);return doSet(k);}

function migrateCfg(c){

  if(!out.tags||!out.tags.length)out.tags=DEFTAGS.slice();
  out.tags=out.tags.map(function(t,i){var n=typeof t==='string'?t:t.n;return{n:n,c:(t&&t.c)||PAL[i%PAL.length]};});
  if(!out.funTags||!out.funTags.length)out.funTags=DEFFUN.slice();
  if(!isFinite(out.funCap))out.funCap=120;
  if(!isFinite(out.sleepGoal))out.sleepGoal=450;
  if(!isFinite(out.goal))out.goal=240;
  if(!out.mix)out.mix={};if(!out.reviews)out.reviews={};
  if(!out.theme||out.theme==='day')out.theme='system';if(out.theme==='night')out.theme='dark';
  if(!out.tags.some(function(t){return t.n===out.last;}))out.last=out.tags[0].n;

var pulling=false;
async function pull(quiet){
  if(Store.mode==='fb')return;
  if(pulling||!apiPresent())return;
  if(quiet){
    if(Date.now()-ui.lastAct<2500)return;
    var ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;
    if(document.getElementById('sheet')&&!document.getElementById('sheet').hidden)return;
  }
  if(!Store.live){pulling=true;try{Store.live=await probe();}finally{pulling=false;}
    if(Store.live){renderSync();commitSessions();ssetNow(K.C,S.cfg);toast('Saving again. Everything on screen is stored.');}return;}
  pulling=true;
  try{
    var rs=await sgetR(K.S),rt=await sgetR(K.T),ra=await sgetR(K.A),rl=await sgetR(K.SL),rc=await sgetR(K.C),rf=await sgetR(K.F);
    if(quiet&&Date.now()-ui.lastAct<2500)return;
    if(!rs.ok){ui.syncNote='Sync paused, nothing lost';renderSync();return;}
    ui.syncNote=null;
    var sig0=JSON.stringify([S.sessions.length,S.active,S.fun,S.sleeping,S.cfg.goal,S.cfg.tags,S.cfg.funTags]);
    if(rc.ok&&rc.val&&!pending(K.C)){var keepTheme=S.cfg.theme;S.cfg=migrateCfg(rc.val);if(!rc.val.theme)S.cfg.theme=keepTheme;}
    S.tombs=mergeTombs(S.tombs,(rt.ok&&rt.val)||{});
    var remote=normalise(rs.val);
    var merged=unionSessions(S.sessions,remote,S.tombs);
    var behind=merged.length!==remote.length||Store.needsMerge;
    S.sessions=merged;Store.bootReadFailed=false;
    if(ra.ok&&!pending(K.A))S.active=ra.val;
    if(rl.ok&&!pending(K.SL))S.sleeping=rl.val;
    if(rf.ok&&!pending(K.F))S.fun=rf.val;
    recalc();
    if(behind){Store.needsMerge=false;ssetNow(K.T,S.tombs);ssetNow(K.S,S.sessions);}
    var sig1=JSON.stringify([S.sessions.length,S.active,S.fun,S.sleeping,S.cfg.goal,S.cfg.tags,S.cfg.funTags]);
    ui.lastSync=Date.now();
    if(sig0!==sig1)render();else renderSync();
  }finally{pulling=false;}
}

function csvLine(line){var out=[],cur='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];
  if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
  else{if(ch==='"')q=true;else if(ch===','){out.push(cur);cur='';}else cur+=ch;}}out.push(cur);return out;}
function importCsv(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  var res={added:0,dup:0,bad:0,rows:[]};if(!lines.length)return res;
  var i0=/date\s*,\s*start/i.test(lines[0])?1:0;
  var have={};S.sessions.forEach(function(x){have[x.start+':'+x.dur+':'+kindOf(x)]=1;});
  for(var i=i0;i<lines.length;i++){
    var f=csvLine(lines[i]);if(f.length<4){res.bad++;continue;}
    var dm=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(f[0].trim()),tm=/^(\d{1,2}):(\d{2})$/.exec(f[1].trim()),mins=parseInt(f[3],10);
    if(!dm||!tm||!isFinite(mins)||mins<1||mins>1440){res.bad++;continue;}
    var kind=(f[7]||'').trim().toLowerCase();if(kind!=='fun'&&kind!=='sleep')kind='study';
    var st=new Date(+dm[1],+dm[2]-1,+dm[3],+tm[1],+tm[2]).getTime(),dur=mins*60000,key=st+':'+dur+':'+kind;
    if(have[key]){res.dup++;continue;}have[key]=1;

    if(f[6]&&f[6].trim())row.note=f[6].trim();

}

/* ---------- weekly review ---------- */
function weekStats(ws){
  var we=new Date(ws);we.setDate(ws.getDate()+7);
  var inWeek=S.sessions.filter(function(x){return x.start>=ws.getTime()&&x.start<we.getTime();});
  var list=inWeek.filter(isStudy),fun=inWeek.filter(isFun);
  var total=0,mix={},days={},fs=0,fn=0,best=null,funTotal=0;
  if(S.active&&S.active.start>=ws.getTime()&&S.active.start<we.getTime()){var lv=el();total+=lv;mix[S.active.tag]=(mix[S.active.tag]||0)+lv;days[dk(S.active.start)]=1;}
  list.forEach(function(x){total+=x.dur;var t=x.tag||'その他';mix[t]=(mix[t]||0)+x.dur;days[dk(x.start)]=1;
    if(x.focus){fs+=x.focus;fn++;if(!best||x.focus>best.focus||(x.focus===best.focus&&x.dur>best.dur))best=x;}});
  fun.forEach(function(x){funTotal+=x.dur;});
  if(!list.length&&total)list=[S.active];
  return{ws:ws,list:list,total:total,mix:mix,daysActive:Object.keys(days).length,avgFocus:fn?fs/fn:0,rated:fn,best:best,
    target:S.cfg.goal*60000*7,funTotal:funTotal};

function reviewQuestion(st){

function insHours(){
  var rated=S.sessions.filter(function(x){return isStudy(x)&&x.focus;}),need=25;
  if(rated.length<need)return{locked:true,have:rated.length,need:need};
  var b={};rated.forEach(function(x){var h=new Date(x.start).getHours();if(!b[h])b[h]={s:0,n:0};b[h].s+=x.focus;b[h].n++;});
  var best=null,worst=null;
  for(var h in b){if(b[h].n<2)continue;var a=b[h].s/b[h].n;
    if(!best||a>best.avg)best={h:+h,avg:a};if(!worst||a<worst.avg)worst={h:+h,avg:a};}
  return{locked:false,b:b,best:best,worst:worst,total:rated.length};
}
function insDrift(){
  var cut=Date.now()-30*864e5,recent=S.sessions.filter(function(x){return isStudy(x)&&x.start>=cut;}),need=15;
  if(recent.length<need)return{locked:true,have:recent.length,need:need};
  var tot=0,mix={};recent.forEach(function(x){tot+=x.dur;var t=x.tag||'その他';mix[t]=(mix[t]||0)+x.dur;});
  var rows=S.cfg.tags.map(function(t){return{n:t.n,c:t.c,actual:tot?(mix[t.n]||0)/tot*100:0,
    target:S.cfg.mix[t.n]!==undefined?S.cfg.mix[t.n]:null,ms:mix[t.n]||0};}).filter(function(r){return r.ms>0||r.target;});
  rows.sort(function(a,b){return b.actual-a.actual;});
  return{locked:false,rows:rows,total:tot,count:recent.length};
}
function insLength(){
  var list=S.sessions.filter(isStudy),need=20;
  if(list.length<need)return{locked:true,have:list.length,need:need};
  var edges=[0,30,60,90,120,1e9],b=[0,0,0,0,0],ms=[0,0,0,0,0];
  list.forEach(function(x){var m=x.dur/60000;for(var i=0;i<5;i++)if(m>=edges[i]&&m<edges[i+1]){b[i]++;ms[i]+=x.dur;break;}});
  var tot=list.reduce(function(a,x){return a+x.dur;},0);
  var med=list.slice().sort(function(p,q){return p.dur-q.dur;})[Math.floor(list.length/2)].dur;
  return{locked:false,b:b,ms:ms,total:tot,median:med,longShare:tot?(ms[3]+ms[4])/tot*100:0,count:list.length};
}

/* Wait for sign-in and the first data, then keep listening. */
function fbLoad(){
  return new Promise(function(resolve){
    var first=true;
    FB.A.onAuthStateChanged(FB.auth,function(u){
      FB.unsub.forEach(function(x){try{x();}catch(e){}});FB.unsub=[];
      FB.user=u;FB.gotSessions=false;FB.gotMeta=false;FB.server={};
      if(!u){
        S.sessions=[];S.active=null;S.fun=null;S.sleeping=null;S.tombs={};S.cfg=migrateCfg(null);
        Store.live=false;recalc();
        if(first){first=false;resolve();}else render();
        return;
      }
      Store.live=true;Store.bootReadFailed=false;Store.needsMerge=false;
      FB.F.setDoc(uref(),{email:u.email||'',seen:Date.now()},{merge:true}).catch(function(){});
      var done=function(){if(FB.gotSessions&&FB.gotMeta){recalc();
        if(first){first=false;resolve();}else scheduleRender();}};
      FB.unsub.push(FB.F.onSnapshot(sessCol(),{includeMetadataChanges:true},function(snap){
        var list=[],srv={};
        snap.forEach(function(d){var x=d.data();if(!x||S.tombs[d.id])return;x.id=d.id;list.push(x);srv[d.id]=JSON.stringify(x);});
        FB.server=srv;S.sessions=normalise(list).sort(function(a,b){return a.start-b.start;});
        FB.pending=snap.metadata.hasPendingWrites;FB.fromCache=snap.metadata.fromCache;
        S.sessions.forEach(function(s){if(!isSleep(s))ensureTag(s.tag,isFun(s));});
        recalc();
        if(!FB.gotSessions){FB.gotSessions=true;done();}else{scheduleRender();}
        renderSync();
      },function(e){FB.err=fbMsg(e);Store.needsMerge=true;renderSync();}));
      FB.unsub.push(FB.F.onSnapshot(FB.F.collection(FB.db,'users',u.uid,'meta'),function(snap){
        var m={};snap.forEach(function(d){m[d.id]=d.data()&&d.data().v;});
        S.cfg=migrateCfg(m.config||null);
        S.active=m.active||null;S.fun=m.fun||null;S.sleeping=m.sleeping||null;
        if(!FB.gotMeta){FB.gotMeta=true;
          if(S.active&&S.active.running&&el()>5*36e5){S.active.acc=el();S.active.running=false;S.active.since=null;fbMeta('active',S.active);ui.banner='left-running';}
          done();}
        else scheduleRender();
      },function(e){FB.err=fbMsg(e);renderSync();}));
    });
  });
}
function fbMeta(name,val){
  if(!FB.user)return Promise.resolve(false);
  return FB.F.setDoc(metaDoc(name),{v:val===undefined?null:val,t:Date.now()})
    .then(function(){return true;},function(e){FB.err=fbMsg(e);toast('Could not save: '+FB.err);return false;});
}
/* Sessions: write what changed since the last server snapshot, delete what was removed. */
async function fbCommit(){
  if(!FB.user)return false;
  var ops=[];
  Object.keys(S.tombs).forEach(function(id){if(FB.server[id])ops.push(['del',id]);});
  S.sessions.forEach(function(s){var j=JSON.stringify(s);if(FB.server[s.id]!==j)ops.push(['set',s.id,s]);});
  for(var i=0;i<ops.length;i+=400){
    var b=FB.F.writeBatch(FB.db);
    ops.slice(i,i+400).forEach(function(o){
      var r=FB.F.doc(sessCol(),o[1]);
      if(o[0]==='del')b.delete(r);
      else{var d={};for(var k in o[2])if(o[2][k]!==undefined)d[k]=o[2][k];d.kind=d.kind||'study';b.set(r,d);}
    });
    try{await b.commit();}catch(e){FB.err=fbMsg(e);toast('Could not save: '+FB.err);return false;}
  }
  ops.forEach(function(o){if(o[0]==='del'){delete S.tombs[o[1]];delete FB.server[o[1]];}});
  return true;
}

function sleepHtml(){

function backupAge(){

/* ================= render ================= */
function renderGate(){
  var tb=document.querySelector('.tabbar');
  if(Store.mode!=='fb'||FB.user){tb.hidden=false;return false;}
  tb.hidden=true;
  ['today','week','insights','log'].forEach(function(t){document.getElementById('v-'+t).hidden=t!=='today';});
  var v=$('#v-today');
  if(!FB.ready){v.innerHTML='<div class="gate"><h1 id="h-today">Study Log</h1><p class="hint">Loading…</p></div>';return true;}
  v.innerHTML='<div class="gate"><div class="gateband" aria-hidden="true"><i style="left:0;width:26%;background:var(--sleep)"></i>'+
    '<i style="left:38%;width:9%;background:#5856D6"></i><i style="left:55%;width:7%;background:#E07A00"></i><i style="left:84%;width:5%;background:var(--fun)"></i></div>'+
    '<h1 id="h-today">Study Log</h1><p class="gatelead">Study, entertainment and sleep, drawn as one day. Saved to your Google account and synced between your laptop and phone.</p>'+
    '<button class="btn filled" data-act="signIn" style="width:100%;max-width:340px">Continue with Google</button>'+
    (FB.err?'<p class="foot" style="color:var(--danger);max-width:340px">'+esc(FB.err)+'</p>':'')+
    '<p class="foot" style="max-width:340px">Only you can read your data. It works offline and catches up when you reconnect.</p></div>';
  return true;
}
function render(){
  applyTheme();
  if(renderGate())return;
  ['today','week','insights','log'].forEach(function(t){
    var v=document.getElementById('v-'+t);v.hidden=ui.tab!==t;
    document.getElementById('t-'+t).setAttribute('aria-selected',String(ui.tab===t));
  });
  if(ui.tab==='today')renderToday();else if(ui.tab==='week')renderWeek();else if(ui.tab==='insights')renderInsights();else renderLog();
  tickLoop();
}
/* live numbers update in place, so typing and focus are never disturbed */
var ticker=null,bandTick=0;
function tickLoop(){
  var need=(S.active&&S.active.running)||S.fun||S.sleeping;
  if(need&&!ticker)ticker=setInterval(tick,1000);
  if(!need&&ticker){clearInterval(ticker);ticker=null;}
}
function tick(){
  if(document.hidden)return;
  if(ui.tab==='today'){
    var a=S.active,c=$('#clock');
    if(a&&!isFun(a)&&c){c.textContent=hms(el());
      var g=S.cfg.goal*60000,t=studyToday(),p=g?Math.min(1,t/g):0,C=2*Math.PI*52;
      var rv=$('#ringVal');if(rv)rv.setAttribute('stroke-dashoffset',(C*(1-p)).toFixed(1));
      var rp=$('#ringPct');if(rp)rp.textContent=Math.round(p*100)+'%';
      var cs=$('#clockSub');if(cs)cs.textContent=hm(t)+' of '+hm(g)+' today';}
    if(S.fun){var fb=$('#funBig');if(fb)fb.textContent=hms(elFun());}
    if(S.sleeping){var sb=$('#sleepBig');if(sb)sb.textContent=hms(sleepEl());}
    if(++bandTick%30===0){var bs=document.querySelector('#v-today .band');
      if(bs){var wrap=bs.parentNode;var tmp=document.createElement('div');tmp.innerHTML=bandHtml(today(),true);
        wrap.replaceChild(tmp.firstChild,bs);var bsum=$('#bandSum');if(bsum)bsum.textContent=bandSummary(today());}}
  }else if(ui.tab==='week'&&++bandTick%30===0)render();
}

/* ---------- sheet (bottom sheet on phones, centred on wide screens) ---------- */
var sheetPrev=null,sheetOnClose=null;
function sheetOpen(){return !$('#sheet').hidden;}
function openSheet(o){
  touch();
  var sh=$('#sheet'),sc=$('#scrim');
  sheetPrev=document.activeElement;sheetOnClose=o.onClose||null;
  $('#sheetTitle').textContent=o.title;
  $('#sheetBody').innerHTML=o.body;
  var ok=$('#sheetOk');
  if(o.ok){ok.hidden=false;ok.textContent=o.ok.label;ok.style.color=o.ok.danger?'var(--danger)':'';ok.onclick=function(){touch();o.ok.fn();};}
  else ok.hidden=true;
  $('#sheetCancel').textContent=o.cancel||'Cancel';
  sh.hidden=false;sc.hidden=false;
  requestAnimationFrame(function(){requestAnimationFrame(function(){sh.classList.add('on');sc.classList.add('on');});});
  if(o.onOpen)o.onOpen();
  setTimeout(function(){var f=sh.querySelector(o.focus||'input:not([type=hidden]),textarea,select');
    if(f&&window.matchMedia('(min-width:720px)').matches)f.focus();else $('#sheetCancel').focus();},60);
}
function closeSheet(){
  var sh=$('#sheet'),sc=$('#scrim');if(sh.hidden)return;
  sh.classList.remove('on');sc.classList.remove('on');
  setTimeout(function(){sh.hidden=true;sc.hidden=true;$('#sheetBody').innerHTML='';},260);
  if(sheetOnClose){var f=sheetOnClose;sheetOnClose=null;f();}
  if(sheetPrev&&document.contains(sheetPrev))try{sheetPrev.focus();}catch(e){}
}
function ask(msg,yes,fn,danger){
  openSheet({title:'Are you sure?',body:'<p class="lead" style="margin:6px 4px 0;font-weight:400">'+esc(msg)+'</p>',cancel:'Cancel',
    ok:{label:yes,danger:danger!==false,fn:function(){closeSheet();fn();}}});
}

/* ---------- study timer ---------- */
function startStudy(){
  if(S.fun){endFun(true);}
  S.active={start:Date.now(),acc:0,since:Date.now(),running:true,tag:S.cfg.last,kind:'study',note:(ui.pendingNote||'').trim()};
  ui.pendingNote='';ui.banner=null;
  ssetNow(K.A,S.active);render();
}
function studyMain(){
  touch();
  if(!S.active)return startStudy();
  if(S.active.running){S.active.acc=el();S.active.running=false;S.active.since=null;}
  else{if(S.fun)endFun(true);S.active.since=Date.now();S.active.running=true;}
  ui.banner=null;ssetNow(K.A,S.active);render();
}
function studyEnd(){
  if(!S.active)return;touch();
  var d=el();ui.banner=null;
  if(d<10000){S.active=null;ssetNow(K.A,null);render();toast('Under 10 seconds, so nothing was logged');return;}
  var rec={id:uid(),start:S.active.start,dur:d,tag:S.active.tag,kind:'study'};
  if(S.active.note)rec.note=S.active.note;
  S.active=null;ssetNow(K.A,null);
  putSession(rec);render();askFocus(rec,d);
}
function studyDrop(){
  if(!S.active)return;
  var go=function(){S.active=null;ui.banner=null;ssetNow(K.A,null);render();toast('Session discarded');};
  if(el()<60000)go();else ask('Discard '+hm(el())+' without logging it?','Discard',go);
}
function askFocus(rec,d){
  var h='<p class="hint" style="text-align:center;margin:4px 0 2px">How focused was that '+hm(d)+' of <span lang="ja">'+esc(rec.tag)+'</span>?</p>'+
    '<div class="focus5" role="group" aria-label="Focus rating">';
  for(var i=1;i<=5;i++)h+='<button data-act="rate" data-v="'+i+'" aria-pressed="false" aria-label="'+i+', '+FOCUS[i]+'">'+i+'</button>';
  h+='</div><div class="focuslab" id="focusLab">1 is scattered, 5 is deep</div>';
  ui.rating=rec;
  openSheet({title:hm(d)+' logged',body:h,cancel:'Skip',ok:{label:'Save',fn:function(){
    closeSheet();if(rec.focus){putSession(rec);toast('Saved, '+FOCUS[rec.focus].toLowerCase()+' focus');}
  }},onClose:function(){ui.rating=null;}});
}

/* ---------- entertainment timer ---------- */
function startFun(){
  if(S.active&&S.active.running){S.active.acc=el();S.active.running=false;S.active.since=null;ssetNow(K.A,S.active);toast('Study paused while you take a break');}
  S.fun={start:Date.now(),tag:S.cfg.lastFun,kind:'fun'};ssetNow(K.F,S.fun);render();
}
function endFun(quiet){
  if(!S.fun)return;var d=elFun(),f=S.fun;S.fun=null;ssetNow(K.F,null);
  if(d<10000){if(!quiet)toast('Under 10 seconds, so nothing was logged');render();return;}
  putSession({id:uid(),start:f.start,dur:d,tag:f.tag,kind:'fun'});
  toast('Logged '+hm(d)+' of '+f.tag);render();
}

/* ---------- sleep ---------- */
function bed(){
  touch();
  if(S.active&&S.active.running){S.active.acc=el();S.active.running=false;S.active.since=null;ssetNow(K.A,S.active);}
  if(S.fun)endFun(true);
  S.sleeping={start:Date.now()};ssetNow(K.SL,S.sleeping);render();toast('Sleep timer started. Good night.');
}
function wake(){
  touch();var d=sleepEl();
  if(d<10*60000){ask('Only '+hm(d)+' so far. Discard this instead of logging it?','Discard',function(){S.sleeping=null;ssetNow(K.SL,null);render();});return;}
  var st=S.sleeping.start;S.sleeping=null;ssetNow(K.SL,null);
  saveSleep(st,d);toast('Slept '+hm(d));
}
function saveSleep(bedT,dur,replaceId){
  var wk=dk(bedT+dur);
  S.sessions.filter(function(x){return isSleep(x)&&dk(x.start+x.dur)===wk&&x.id!==replaceId;}).forEach(function(x){S.tombs[x.id]=Date.now();});
  S.sessions=S.sessions.filter(function(x){return !(isSleep(x)&&dk(x.start+x.dur)===wk&&x.id!==replaceId);});
  putSession({id:replaceId||uid(),start:bedT,dur:dur,tag:'sleep',kind:'sleep'});render();
}
function sleepSheet(existing,fixing){
  var wakeK=existing?dk(existing.start+existing.dur):today();
  var bedV=existing?cl(existing.start):'23:30',wakeV=existing?cl(existing.start+existing.dur):'07:00';
  if(fixing&&S.sleeping)bedV=cl(S.sleeping.start);
  var h='<div class="card"><div class="field"><label for="slD">Morning you woke up</label><input class="input" type="date" id="slD" value="'+wakeK+'"></div>'+
    '<div class="grid2" style="margin-top:12px"><div class="field"><label for="slB">Went to bed</label><input class="input" type="time" id="slB" value="'+bedV+'"></div>'+
    '<div class="field"><label for="slW">Woke up</label><input class="input" type="time" id="slW" value="'+wakeV+'"></div></div>'+
    '<p class="lead" id="slPrev" style="margin-top:14px"></p></div>'+
    (existing?'<button class="btn danger" data-act="delSleep" data-id="'+existing.id+'">'+ic('trash','sm')+'Delete this night</button>':'')+
    '<div style="height:90px" aria-hidden="true"></div>';
  function calc(){
    var dv=$('#slD').value,bv=$('#slB').value,wv=$('#slW').value;if(!dv||!bv||!wv)return null;
    var p=dv.split('-'),b=bv.split(':'),w=wv.split(':');
    var wakeT=new Date(+p[0],+p[1]-1,+p[2],+w[0],+w[1]).getTime(),bedT=new Date(+p[0],+p[1]-1,+p[2],+b[0],+b[1]).getTime();
    if(bedT>=wakeT)bedT-=864e5;return{bed:bedT,dur:wakeT-bedT};
  }
  openSheet({title:existing?'Edit sleep':(fixing?'Correct last night':'Log sleep'),body:h,ok:{label:'Save',fn:function(){
    var r=calc();if(!r){toast('Fill in all three');return;}
    if(r.dur<10*60000||r.dur>20*36e5){toast('That works out to '+hm(r.dur)+'. Check the times.');return;}
    if(S.sleeping&&(fixing||!existing)){S.sleeping=null;ssetNow(K.SL,null);}
    closeSheet();saveSleep(r.bed,r.dur,existing&&existing.id);toast('Saved '+hm(r.dur)+' of sleep');
  }},onOpen:function(){
    var upd=function(){var r=calc();$('#slPrev').textContent=r?'That is '+hm(r.dur)+' of sleep.':'Fill in all three.';};
    ['#slD','#slB','#slW'].forEach(function(id){$(id).addEventListener('input',upd);$(id).addEventListener('change',upd);});upd();
  }});
}

function sessionSheet(s,kind,dayK){
  var fun=(s?kindOf(s):kind)==='fun',isNew=!s;
  var k=s?dk(s.start):(dayK||today()),mins=s?Math.round(s.dur/60000):60;
  var startV=s?cl(s.start):(k===today()?cl(Math.max(day0(k),Math.floor((Date.now()-36e5)/3e5)*3e5)):'09:00');
  var tag=s?s.tag:(fun?S.cfg.lastFun:S.cfg.last);
  ui.editFocus=s&&s.focus||0;
  var h='<div class="card" style="display:flex;flex-direction:column;gap:12px">'+
    (isNew?dayChips(k):'')+
    '<div class="grid3"><div class="field"><label for="eD">Date</label><input class="input" type="date" id="eD" value="'+k+'"></div>'+
    '<div class="field"><label for="eT">Start</label><input class="input" type="time" id="eT" value="'+startV+'"></div>'+
    '<div class="field"><label for="eM">Minutes</label><input class="input tnum" type="number" id="eM" min="1" max="1440" inputmode="numeric" value="'+mins+'"></div></div>'+
    lenChips(mins)+
    '<div class="field"><label for="eS">'+(fun?'Kind':'Subject')+'</label>'+tagSelect(fun,tag)+'</div>'+
    (fun?'':'<div class="field"><label for="eN">Note</label><input class="input" id="eN" maxlength="90" placeholder="What were you working on?" value="'+esc(s&&s.note||'')+'"></div>'+
    '<div class="field"><label>Focus</label><div class="focus5" role="group" aria-label="Focus rating">'+
      [1,2,3,4,5].map(function(i){return '<button type="button" data-act="editRate" data-v="'+i+'" aria-pressed="'+(i<=ui.editFocus)+'" aria-label="'+i+', '+FOCUS[i]+'">'+i+'</button>';}).join('')+
    '</div><div class="focuslab" id="eFL">'+(ui.editFocus?FOCUS[ui.editFocus]:'Not rated. Tap a number, tap again to clear.')+'</div></div>')+
    '</div>'+(isNew?'':'<button class="btn danger" data-act="delFromSheet" data-id="'+s.id+'">'+ic('trash','sm')+'Delete this session</button>')+
    '<div style="height:80px" aria-hidden="true"></div>';
  openSheet({title:isNew?(fun?'Add entertainment':'Add a session'):(fun?'Edit entertainment':'Edit session'),body:h,ok:{label:isNew?'Add':'Save',fn:function(){
    var dv=$('#eD').value,tv=$('#eT').value,mv=parseInt($('#eM').value,10);
    if(!dv||!tv){toast('Choose a date and a start time');return;}
    if(!isFinite(mv)||mv<1||mv>1440){toast('Minutes must be between 1 and 1440');return;}
    var p=dv.split('-'),t=tv.split(':');
    var rec=s?s:{id:uid(),kind:fun?'fun':'study'};
    rec.start=new Date(+p[0],+p[1]-1,+p[2],+t[0],+t[1]).getTime();rec.dur=mv*60000;rec.tag=$('#eS').value;
    if(!fun){var nv=$('#eN').value.trim();if(nv)rec.note=nv;else delete rec.note;if(ui.editFocus)rec.focus=ui.editFocus;else delete rec.focus;}
    closeSheet();putSession(rec);ui.logDay=dk(rec.start);ui.selDay=dk(rec.start);render();
    toast((isNew?'Added ':'Saved ')+hm(rec.dur));
  }}});
}

function tagUse(n,fun){var c=0,t=0;S.sessions.forEach(function(x){if(!isSleep(x)&&isFun(x)===!!fun&&x.tag===n){c++;t+=x.dur;}});return{n:c,ms:t};}
function tagsSheet(mode){
  ui.tagMode=mode||'study';
  openSheet({title:'Subjects',body:'',cancel:'Close',ok:{label:'Done',fn:closeSheet},onOpen:drawTags});
}
function drawTags(){
  var fun=ui.tagMode==='fun',arr=fun?S.cfg.funTags:S.cfg.tags;
  var h='<div class="seg" role="tablist" aria-label="Kind"><button role="tab" data-act="tagMode" data-v="study" aria-selected="'+!fun+'">Study</button>'+
    '<button role="tab" data-act="tagMode" data-v="fun" aria-selected="'+fun+'">Entertainment</button></div><div class="list">';
  arr.forEach(function(t,i){
    var u=tagUse(t.n,fun);
    h+='<div class="row"><button class="sw" style="background:'+t.c+';width:28px;height:28px;border-radius:50%" data-act="tagColor" data-i="'+i+'" aria-label="Change colour of '+esc(t.n)+'"></button>'+

      (ui.tagColorOpen===i?'<div class="swatches">'+(fun?FUNPAL:PAL).map(function(c){return '<button data-act="tagPick" data-i="'+i+'" data-c="'+c+'" style="background:'+c+'" aria-pressed="'+(c===t.c)+'" aria-label="Colour '+c+'"></button>';}).join('')+'</div>':'');
  });
  h+='</div><div style="display:flex;gap:8px"><input class="input" id="newTag" maxlength="24" placeholder="New '+(fun?'kind':'subject')+'" aria-label="New '+(fun?'kind':'subject')+'" lang="ja">'+
    '<button class="btn tinted" data-act="tagAdd" style="flex:0 0 auto">Add</button></div>'+
    '<p class="foot" style="margin:0 4px">Renaming moves every logged session to the new name. A subject in use cannot be removed; rename it into another one to merge them.</p>';
  $('#sheetBody').innerHTML=h;
}
function renameTag(i,v){
  var fun=ui.tagMode==='fun',arr=fun?S.cfg.funTags:S.cfg.tags,t=arr[i];v=v.trim();
  if(!t||!v||v===t.n)return;
  var clash=arr.findIndex(function(o,j){return j!==i&&o.n===v;});
  var old=t.n,changed=[];
  S.sessions.forEach(function(x){if(!isSleep(x)&&isFun(x)===fun&&x.tag===old){x.tag=v;changed.push(x);}});
  if(clash>=0)arr.splice(i,1);else t.n=v;
  if(!fun&&S.cfg.last===old)S.cfg.last=v;if(fun&&S.cfg.lastFun===old)S.cfg.lastFun=v;
  if(!fun&&S.cfg.mix[old]!==undefined){S.cfg.mix[v]=S.cfg.mix[old];delete S.cfg.mix[old];}
  saveCfg();recalc();commitSessions();drawTags();render();
  toast(clash>=0?'Merged into '+v:'Renamed to '+v);
}

  var fbm=Store.mode==='fb';
  var h='<div class="card"><p class="lead">'+(fbm?(navigator.onLine?'Synced with your Google account':'Offline'):(Store.live?'Saving normally':'Not saving'))+'</p><p class="foot" style="margin:0">'+
    (fbm?(navigator.onLine?'Every change is saved to Firestore as you make it and appears on your other devices within a second or two.':'Changes are kept on this device and upload by themselves when you reconnect.'):Store.live?'Every change is written as you make it, and merged with anything logged on your other devices.':
      'Changes stay on this screen until storage answers. '+esc(Store.lastErr||''))+'</p>'+
    '<div class="btnrow" style="margin-top:12px"><button class="btn tinted sm" data-act="runDiag">Run a check</button></div><div class="diag" id="diagOut" style="margin-top:10px"></div></div>';
  openSheet({title:'Storage',body:h,cancel:'Close'});
}

/* ---------- event wiring ---------- */
var ACT={
  tab:function(b){ui.tab=b.dataset.tab;ui.bandSel=null;try{history.replaceState(null,'','#'+ui.tab);}catch(e){}render();window.scrollTo(0,0);},
  studyMain:studyMain, studyEnd:studyEnd, studyDrop:studyDrop,
  pickTag:function(b){var t=b.dataset.tag;S.cfg.last=t;if(S.active&&!isFun(S.active)){S.active.tag=t;ssetNow(K.A,S.active);}saveCfg();render();},
  editIntent:function(){openSheet({title:'Working on',body:'<div class="card"><div class="field"><label for="noteI">What are you working on?</label><input class="input" id="noteI" maxlength="90" value="'+esc(S.active&&S.active.note||'')+'"></div></div>',
    ok:{label:'Save',fn:function(){if(S.active){S.active.note=$('#noteI').value.trim();ssetNow(K.A,S.active);}closeSheet();render();}},focus:'#noteI'});},
  shuffle:function(){var q=pickNote(true);$('#qText').textContent=q.t;$('#qSrc').textContent='Idea from '+q.s.replace(' · ',' by ');},
  bandSel:function(b){var key=b.dataset.k+':'+b.dataset.i;ui.bandSel=ui.bandSel===key?null:key;render();},
  rate:function(b){var v=+b.dataset.v;if(ui.rating)ui.rating.focus=v;
    document.querySelectorAll('[data-act="rate"]').forEach(function(x){x.setAttribute('aria-pressed',String(+x.dataset.v<=v));});
    $('#focusLab').textContent=FOCUS[v];},
  funMain:function(){touch();if(S.fun)endFun();else startFun();},
  pickFun:function(b){S.cfg.lastFun=b.dataset.tag;if(S.fun){S.fun.tag=S.cfg.lastFun;ssetNow(K.F,S.fun);}saveCfg();render();},
  funQuick:function(b){var m=+b.dataset.m,now=Date.now();
    putSession({id:uid(),start:now-m*60000,dur:m*60000,tag:S.cfg.lastFun,kind:'fun'});render();toast('Logged '+hm(m*60000)+' of '+S.cfg.lastFun);},
  bed:bed, wake:wake,
  sleepLog:function(b){sleepSheet(null,b.dataset.fix==='1');},
  delSleep:function(b){var id=b.dataset.id;closeSheet();setTimeout(function(){ask('Delete this night of sleep?','Delete',function(){deleteSession(id);render();toast('Deleted');});},280);},
  openAdd:function(b){sessionSheet(null,b.dataset.kind||'study',b.dataset.k||(ui.tab==='log'?ui.logDay:null));},
  edit:function(b){var s=S.sessions.find(function(x){return x.id===b.dataset.id;});if(!s)return;if(isSleep(s))sleepSheet(s);else sessionSheet(s);},
  del:function(b){var s=S.sessions.find(function(x){return x.id===b.dataset.id;});if(!s)return;
    ask('Delete '+hm(s.dur)+' of '+(isSleep(s)?'sleep':s.tag)+' from '+cl(s.start)+'?','Delete',function(){deleteSession(s.id);render();toast('Deleted');});},
  delFromSheet:function(b){var id=b.dataset.id,s=S.sessions.find(function(x){return x.id===id;});closeSheet();
    setTimeout(function(){ask('Delete this '+hm(s.dur)+' session?','Delete',function(){deleteSession(id);render();toast('Deleted');});},280);},
  pickDay:function(b){$('#eD').value=b.dataset.k;b.parentNode.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c===b));});},
  pickLen:function(b){$('#eM').value=b.dataset.m;b.parentNode.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-pressed',String(c===b));});},
  editRate:function(b){var v=+b.dataset.v;ui.editFocus=ui.editFocus===v?0:v;
    document.querySelectorAll('[data-act="editRate"]').forEach(function(x){x.setAttribute('aria-pressed',String(+x.dataset.v<=ui.editFocus));});
    $('#eFL').textContent=ui.editFocus?FOCUS[ui.editFocus]:'Not rated';},
  view:function(b){ui.view=b.dataset.v;ui.anchor=new Date();render();},
  shift:function(b){var d=+b.dataset.d,a=ui.anchor;
    if(ui.view==='week')ui.anchor=new Date(a.getFullYear(),a.getMonth(),a.getDate()+7*d);
    else if(ui.view==='month')ui.anchor=new Date(a.getFullYear(),a.getMonth()+d,1);
    else ui.anchor=new Date(a.getFullYear()+d,0,1);render();},
  selDay:function(b){ui.selDay=b.dataset.k;render();},
  toMonth:function(b){ui.anchor=new Date(ui.anchor.getFullYear(),+b.dataset.m,1);ui.view='month';render();},
  openDay:function(b){ui.logDay=b.dataset.k;ui.tab='log';ui.bandSel=null;render();window.scrollTo(0,0);},
  logDay:function(b){var d=kd(ui.logDay||today());d.setDate(d.getDate()+(+b.dataset.d));var k=dk(d);if(k>today())return;ui.logDay=k;ui.bandSel=null;render();},
  saveReview:function(b){S.cfg.reviews[b.dataset.k]=$('#revNote').value.trim();saveCfg();toast('Answer saved');},
  theme:function(b){S.cfg.theme=b.dataset.v;saveCfg();render();},
  editGoal:function(){numberSheet('Daily study target','Minutes per day',S.cfg.goal,[120,180,240,300,360,480],minsFmt,function(v){S.cfg.goal=Math.max(1,v);saveCfg();render();toast('Target set to '+hmShort(S.cfg.goal*60000));});},
  editCap:function(){numberSheet('Entertainment limit','Minutes per day',S.cfg.funCap,[0,30,60,90,120,180],minsFmt,function(v){S.cfg.funCap=v;saveCfg();render();toast(v?'Limit set to '+hmShort(v*60000):'Limit turned off');},'A marker, not a lock. Nothing stops you going over.');},
  editSleepGoal:function(){numberSheet('Sleep target','Minutes per night',S.cfg.sleepGoal,[390,420,450,480,510],minsFmt,function(v){S.cfg.sleepGoal=Math.max(60,v);saveCfg();render();});},
  setNum:function(b){$('#numI').value=b.dataset.v;},
  editMix:function(){
    var h='<div class="list">'+S.cfg.tags.map(function(t){var v=S.cfg.mix[t.n];
      return '<label class="row"><span class="sw" style="background:'+t.c+';width:14px;height:14px;border-radius:50%"></span><span class="tx" lang="ja">'+esc(t.n)+'</span>'+
        '<input class="input tnum" style="width:84px;height:38px" type="number" min="0" max="100" inputmode="numeric" data-t="'+esc(t.n)+'" value="'+(v===undefined?'':v)+'" aria-label="Target percent for '+esc(t.n)+'">%</label>';}).join('')+'</div>'+
      '<p class="foot" style="margin:0 4px">Leave a subject blank to skip it. They do not need to add up to 100.</p>';
    openSheet({title:'Target shares',body:h,ok:{label:'Save',fn:function(){S.cfg.mix={};
      document.querySelectorAll('#sheetBody input[data-t]').forEach(function(i){var v=parseInt(i.value,10);if(isFinite(v)&&v>=0&&v<=100)S.cfg.mix[i.dataset.t]=v;});
      saveCfg();closeSheet();render();}}});},
  openTags:function(b){tagsSheet(b&&b.dataset.mode);},
  tagMode:function(b){ui.tagMode=b.dataset.v;ui.tagColorOpen=null;drawTags();},
  tagColor:function(b){var i=+b.dataset.i;ui.tagColorOpen=ui.tagColorOpen===i?null:i;drawTags();},
  tagPick:function(b){var arr=ui.tagMode==='fun'?S.cfg.funTags:S.cfg.tags;arr[+b.dataset.i].c=b.dataset.c;ui.tagColorOpen=null;saveCfg();drawTags();render();},
  tagDel:function(b){var fun=ui.tagMode==='fun',arr=fun?S.cfg.funTags:S.cfg.tags,i=+b.dataset.i,t=arr[i],u=tagUse(t.n,fun);
    if(u.n){toast(t.n+' is used by '+u.n+' sessions. Rename it into another to merge.');return;}
    if(arr.length<=1){toast('Keep at least one');return;}
    arr.splice(i,1);if(S.cfg.last===t.n)S.cfg.last=S.cfg.tags[0].n;if(S.cfg.lastFun===t.n)S.cfg.lastFun=S.cfg.funTags[0].n;
    saveCfg();drawTags();render();toast('Removed '+t.n);},
  tagAdd:function(){var fun=ui.tagMode==='fun',v=$('#newTag').value.trim(),arr=fun?S.cfg.funTags:S.cfg.tags;
    if(!v){toast('Type a name first');return;}if(arr.some(function(t){return t.n===v;})){toast('You already have '+v);return;}
    if(arr.length>=12){toast('Twelve is the most that stays readable');return;}
    ensureTag(v,fun);saveCfg();drawTags();render();toast('Added '+v);},
  openBackup:backupSheet, openStorage:storageSheet,
  copyCsv:function(){var t=$('#csvOut'),done=function(){S.cfg.lastBackup=Date.now();saveCfg();toast('Copied. Paste it somewhere safe.');};
    try{navigator.clipboard.writeText(t.value).then(done,function(){t.select();toast('Select all and copy');});}catch(e){t.select();toast('Select all and copy');}},
  restoreCsv:function(){var txt=$('#csvIn').value;if(!txt.trim()){$('#restoreMsg').textContent='Paste a backup into the box first.';return;}
    var r=importCsv(txt);
    if(!r.added&&!r.dup){$('#restoreMsg').textContent='Nothing readable. Rows look like 2026-10-18,09:00,10:30,90,"研究".';return;}
    r.rows.forEach(function(x){S.sessions.push(x);delete S.tombs[x.id];});
    S.sessions.sort(function(a,b){return a.start-b.start;});recalc();saveCfg();commitSessions();render();
    $('#restoreMsg').textContent='Restored '+r.added+(r.dup?', skipped '+r.dup+' already here':'')+(r.bad?', ignored '+r.bad+' unreadable':'')+'.';
    $('#csvOut').value=buildCsv();},
  snapRestore:async function(b){var r=await sgetR(b.dataset.k);if(!r.ok||!r.val){toast('Could not read that snapshot');return;}
    var snap=normalise(r.val);closeSheet();
    setTimeout(function(){ask('Merge the '+snap.length+' sessions from that snapshot? Nothing here is overwritten; missing ones come back.','Restore',function(){
      var before=S.sessions.length;snap.forEach(function(x){delete S.tombs[x.id];});
      S.sessions=unionSessions(S.sessions,snap,S.tombs);recalc();commitSessions();render();toast('Brought back '+(S.sessions.length-before)+' sessions');},false);},280);},
  runDiag:async function(){var o=$('#diagOut');o.innerHTML='<div class="foot">Checking…</div>';var rows=await diagnose();
    o.innerHTML=rows.map(function(r){return '<div><b class="'+(r.p?'ok':'no')+'">'+(r.p?'Pass':'Fail')+'</b> '+esc(r.n)+'<code>'+esc(r.d)+'</code></div>';}).join('');
    if(rows.length>1&&rows[0].p&&rows[1].p&&!Store.live){Store.live=true;commitSessions();ssetNow(K.C,S.cfg);renderSync();toast('Storage is working. Everything on screen is saved.');}},
  sheetClose:closeSheet,
  signIn:function(b){b.disabled=true;b.textContent='Opening Google…';FB.err='';fbSignIn().finally(function(){b.disabled=false;});},
  signOut:function(){ask('Sign out on this device? Your data stays in your account.','Sign out',function(){fbSignOut();toast('Signed out');},false);}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var f=ACT[b.dataset.act];if(f){touch();f(b,e);}
});
document.addEventListener('input',function(e){
  if(e.target.id==='intentIn'){ui.pendingNote=e.target.value;touch();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&sheetOpen()){closeSheet();return;}
  if(e.target.id==='intentIn'&&e.key==='Enter'){e.preventDefault();studyMain();return;}
  if(e.target.classList&&e.target.classList.contains('tagname')&&e.key==='Enter'){e.preventDefault();e.target.blur();return;}
  if(e.target.id==='newTag'&&e.key==='Enter'){e.preventDefault();ACT.tagAdd();return;}
  if(sheetOpen()&&e.key==='Tab'){var f=[].slice.call($('#sheet').querySelectorAll('button:not([hidden]),input,select,textarea')).filter(function(x){return x.offsetParent!==null;});
    if(!f.length)return;var first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}return;}
  if(e.code==='Space'&&!sheetOpen()&&ui.tab==='today'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();studyMain();}
});
document.addEventListener('focusout',function(e){
  if(e.target.classList&&e.target.classList.contains('tagname'))renameTag(+e.target.dataset.i,e.target.value);
});
$('#scrim').addEventListener('click',closeSheet);

/* ---------- boot ---------- */
async function boot(){
  var h=(location.hash||'').replace('#','');if(['today','week','insights','log'].indexOf(h)>=0)ui.tab=h;
  ui.logDay=today();ui.selDay=today();
  render();
  await loadAll();
  render();
  document.addEventListener('visibilitychange',function(){if(document.hidden)flushAll();else pull(true);});
  window.addEventListener('pagehide',flushAll);
  window.addEventListener('focus',function(){pull(true);});
  window.addEventListener('online',function(){renderSync();});window.addEventListener('offline',function(){renderSync();});
  setInterval(function(){if(!document.hidden)pull(true);},60000);
  setInterval(function(){if(!Store.live&&!document.hidden)pull(true);},15000);
  setInterval(function(){if(!document.hidden&&!sheetOpen()&&Date.now()-ui.lastAct>10000){
    var ae=document.activeElement;if(!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();}},300000);
}
boot();

})();
</script>
